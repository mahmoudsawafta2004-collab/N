<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div class="app-splash" id="appSplash"><img id="splashLogo" alt="" style="display:none"></div>
<header id="site-header"></header>
<main>
  <section class="home-hero" id="homeHero">
    <div class="home-hero-overlay"></div>
    <div class="home-hero-content">
      <span class="home-eyebrow">Fresh. Fast. Made for you.</span>
      <h1 id="heroTitle"></h1>
      <p id="heroText">Order your favorites online for pickup or delivery.</p>
      <div class="home-actions"><a class="btn-secondary home-view-menu" href="menu.html">View Menu</a></div>
    </div>
  </section>
  <section class="home-section">
    <div class="section-heading"><span>What we serve</span><h2>Made to crave</h2></div>
    <div id="homeCategories" class="home-category-grid"></div>
  </section>
  <section class="home-section home-featured">
    <div class="section-heading"><span>Customer favorites</span><h2>Popular picks</h2></div>
    <div id="featuredProducts" class="products-grid"></div>
  </section>
  <section class="home-cta"><div><span>Hungry?</span><h2>Your next favorite meal is one click away.</h2></div><a id="bottomOrder" class="btn-primary" href="menu.html">Start Your Order</a></section>
</main>
<footer id="site-footer"></footer>
<script src="js/store.js"></script><script src="js/i18n.js"></script><script src="js/ui.js"></script>
<script>
(async()=>{await Store.ready;applyDocDir();applyPageColors('menu');applySecondaryColor();applyHeaderColor();const d=Store.get(),s=d.settings;const splash=document.getElementById('splashLogo');if(s.logo){splash.src=s.logo;splash.style.display='block'}
document.title=tField(s.restaurantName)||'Restaurant';renderHeader();renderFooter();document.getElementById('heroTitle').textContent=tField(s.restaurantName)||'Welcome';
const multi=s.multiBranch&&d.branches.length>1;const target=multi?'branches.html':'menu.html';document.querySelector('.home-view-menu').href=target;document.getElementById('bottomOrder').href=target;
const imgs=(s.slider&&s.slider.images)||[];if(imgs[0])document.getElementById('homeHero').style.backgroundImage=`url("${imgs[0]}")`;
const cats=sortByOrder(d.categories||[]).slice(0,6);document.getElementById('homeCategories').innerHTML=cats.map(c=>`<a class="home-category" href="menu.html"><img src="${c.image||PLACEHOLDER_IMG}" alt=""><strong>${tField(c.name)}</strong></a>`).join('');
const products=sortByOrder((d.products||[]).filter(p=>!p.branchIds?.length||p.branchIds.includes(d.branches[0]?.id))).slice(0,4);document.getElementById('featuredProducts').innerHTML=products.map(p=>`<div class="product-card"><div class="product-image-wrap"><img src="${p.image||PLACEHOLDER_IMG}" alt=""></div><div class="product-info"><h3>${tField(p.name)}</h3><p>${tField(p.description)}</p><div class="product-price"><span>${fmtMoney(productBasePrice(p))}</span></div><a class="product-add-btn" href="menu.html">Order Now</a></div></div>`).join('');renderIcons();hideSplash();})();
</script>
</body></html>
